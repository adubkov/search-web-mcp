name: personal-pool-smoke

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sleep_seconds:
        description: Mid-job sleep window (crash-arm kill target)
        default: '0'

jobs:
  smoke:
    runs-on: [self-hosted, personal]
    steps:
      - name: Smoke
        run: |
          echo "personal pool smoke"
          uname -srm
          echo "runner: $RUNNER_NAME"
          sleep "${{ inputs.sleep_seconds || 0 }}"
